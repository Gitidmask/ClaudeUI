name: Build & Release

on:
  push:
    branches: ['feature/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - '.prettierrc.yaml'
      - '.prettierignore'
      - '.eslintrc.*'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from branch name
        id: bump
        run: |
          BRANCH="${{ github.ref_name }}"
          SLUG="${BRANCH#feature/}"
          VERSION="0.0.0-${SLUG}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version from branch: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          LOG=$(git log -20 --pretty=format:'- %s (%h)' --no-merges)
          echo "$LOG" > /tmp/changelog.txt
          {
            echo 'changelog<<CHANGELOG_EOF'
            cat /tmp/changelog.txt
            echo ''
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract branch name
        shell: pwsh
        run: |
          $branchName = "${{ github.ref_name }}"
          $safeName = $branchName.Replace('/', '-')
          Write-Host "Branch name: $branchName"
          Write-Host "Safe name: $safeName"
          "BRANCH_NAME=$branchName" >> $env:GITHUB_ENV
          "SAFE_BRANCH_NAME=$safeName" >> $env:GITHUB_ENV

      - name: Set version
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Write-Host "Version: $version"

          # Update Cargo.toml
          $cargoPath = "src-tauri\Cargo.toml"
          (Get-Content $cargoPath) -replace '^version = ".*"', "version = `"$version`"" | Set-Content $cargoPath
          Write-Host "Updated Cargo.toml version to: $version"

          # Update tauri.conf.json (Tauri v2) using sed-like replacement to preserve JSON structure
          $tauriPath = "src-tauri\tauri.conf.json"
          (Get-Content $tauriPath -Raw) -replace '"version":\s*"[^"]+"', "`"version`": `"$version`"" | Set-Content $tauriPath -NoNewline
          Write-Host "Updated tauri.conf.json version to: $version"

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.bun"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Stamp version into package.json
        run: |
          node -e "const p=require('./package.json'); p.version='${{ needs.version.outputs.version }}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      # - name: Run tests
      #   run: bun run test:ci

      - name: Build frontend
        run: bun run build:web

      - name: Build Tauri app (with NSIS bundle)
        run: bun run tauri build --target x86_64-pc-windows-msvc
        env:
          CI: true

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows-x86_64 | Out-Null
          
          # 收集 MSI 安装包
          Get-ChildItem -Path src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis -Filter *.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist\windows-x86_64\ }
          
          # 创建便携版 ZIP 包（从 release 目录提取）
          $portableDir = "src-tauri\target\x86_64-pc-windows-msvc\release"
          $portableZip = "dist\windows-x86_64\ClaudeUI-portable.zip"
          
          if (Test-Path "$portableDir\ClaudeUI.exe") {
            Compress-Archive -Path "$portableDir\ClaudeUI.exe", "$portableDir\ClaudeUI.dll" -DestinationPath $portableZip -Force
          } else {
            Write-Host "Warning: ClaudeUI.exe not found, skipping portable build"
          }

          Write-Host "Artifacts:"
          Get-ChildItem dist\windows-x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-${{ env.SAFE_BRANCH_NAME }}
          path: dist/windows-x86_64/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ClaudeUI ${{ needs.version.outputs.tag }}
          body: |
            ## Changes

            ${{ needs.version.outputs.changelog }}
          files: artifacts/*
          generate_release_notes: false
