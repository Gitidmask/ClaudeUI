name: Build & Release

on:
  push:
    branches: ['feature/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - '.prettierrc.yaml'
      - '.prettierignore'
      - '.eslintrc.*'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from branch name
        id: bump
        run: |
          # Extract branch slug from feature/xxx → xxx
          BRANCH="${{ github.ref_name }}"
          SLUG="${BRANCH#feature/}"
          # Sanitize to semver-compatible prerelease: 0.0.0-<slug>
          VERSION="0.0.0-${SLUG}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version from branch: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          LOG=$(git log -20 --pretty=format:'- %s (%h)' --no-merges)
          echo "$LOG" > /tmp/changelog.txt
          {
            echo 'changelog<<CHANGELOG_EOF'
            cat /tmp/changelog.txt
            echo ''
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            zip_name: ClaudeUI-${{ needs.version.outputs.version }}-win-x64.zip
            build_dir: dist/win-unpacked

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.bun"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder"
          Add-MpPreference -ExclusionProcess "bun.exe"
          Add-MpPreference -ExclusionProcess "node.exe"

      - uses: actions/setup-node@v4
        with:
          # Pinned to 24.15.0: Node 24.16.0 ships a libuv that aborts on Windows
          # (Assertion failed: !_wcsnicmp(filename, dir, dirlen), src/win/fs-event.c:72)
          # when fs.watch() targets a single file, crashing vitest workers and
          # cascading unrelated suites to "failed". 24.15.0 is the last good runner
          # Node. Revisit once a Node 24.x lands with the libuv fix.
          node-version: 24.15.0

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Read claude CLI version
        id: cli-version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').claudeCliVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache claude CLI source binary
        uses: actions/cache@v4
        with:
          path: .cache/claude-cli
          key: ${{ runner.os }}-claude-cli-src-${{ steps.cli-version.outputs.version }}

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: bun install

      - name: Stamp version into package.json
        run: |
          node -e "const p=require('./package.json'); p.version='${{ needs.version.outputs.version }}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Run tests
        run: bun run test:ci

      - name: Build app
        run: |
          bun run typecheck
          bunx electron-vite build
          bunx vite build --config vite.web.config.ts

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: |
          bunx electron-builder --win --dir

      - name: Zip build output (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.build_dir }}/*" -DestinationPath "${{ matrix.zip_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ClaudeUI ${{ needs.version.outputs.tag }}
          body: |
            ## Changes

            ${{ needs.version.outputs.changelog }}
          files: artifacts/*
          generate_release_notes: false
