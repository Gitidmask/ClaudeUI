name: Build & Release

on:
  push:
    branches: ['feature/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - '.prettierrc.yaml'
      - '.prettierignore'
      - '.eslintrc.*'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from branch name
        id: bump
        run: |
          BRANCH="${{ github.ref_name }}"
          SLUG="${BRANCH#feature/}"
          VERSION="0.0.0-${SLUG}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version from branch: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          LOG=$(git log -20 --pretty=format:'- %s (%h)' --no-merges)
          echo "$LOG" > /tmp/changelog.txt
          {
            echo 'changelog<<CHANGELOG_EOF'
            cat /tmp/changelog.txt
            echo ''
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            zip_name: ClaudeUI-${{ needs.version.outputs.version }}-win-x64.zip
            build_dir: target/release/bundle/msi

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.bun"
          Add-MpPreference -ExclusionProcess "bun.exe"
          Add-MpPreference -ExclusionProcess "node.exe"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install dependencies
        run: bun install

      - name: Stamp version into package.json
        run: |
          node -e "const p=require('./package.json'); p.version='${{ needs.version.outputs.version }}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Run tests
        run: bun run test:ci

      - name: Build web
        run: bun run build:web

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip build output (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ matrix.build_dir }}" -Filter "*.msi" | ForEach-Object {
            Compress-Archive -Path $_.FullName -DestinationPath "${{ matrix.zip_name }}"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ClaudeUI ${{ needs.version.outputs.tag }}
          body: |
            ## Changes

            ${{ needs.version.outputs.changelog }}
          files: artifacts/*
          generate_release_notes: false
