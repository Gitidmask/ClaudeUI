name: Build & Pre-Release

on:
  push:
    branches: [pre-release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - '.prettierrc.yaml'
      - '.prettierignore'
      - '.eslintrc.*'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next pre-release version
        id: bump
        run: |
          LATEST_STABLE=$(git tag -l 'v*' --sort=-v:refname | grep -v '-' | head -1)
          if [ -z "$LATEST_STABLE" ]; then
            NEXT_BASE="1.0.0"
          else
            CURRENT="${LATEST_STABLE#v}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEXT_BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          LATEST_PRE=$(git tag -l "v${NEXT_BASE}-pre.*" --sort=-v:refname | head -1)
          if [ -z "$LATEST_PRE" ]; then
            PRE_NUM=1
          else
            PRE_NUM=$(echo "$LATEST_PRE" | sed 's/.*-pre\.//')
            PRE_NUM=$((PRE_NUM + 1))
          fi

          NEXT="${NEXT_BASE}-pre.${PRE_NUM}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next pre-release version: $NEXT (base: $NEXT_BASE, pre: $PRE_NUM)"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LOG=$(git log --pretty=format:'- %s (%h)' --no-merges)
          else
            LOG=$(git log "${LATEST_TAG}..HEAD" --pretty=format:'- %s (%h)' --no-merges)
          fi
          echo "$LOG" > /tmp/changelog.txt
          {
            echo 'changelog<<CHANGELOG_EOF'
            cat /tmp/changelog.txt
            echo ''
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract branch name
        shell: pwsh
        run: |
          $branchName = "${{ github.ref_name }}"
          $safeName = $branchName.Replace('/', '-')
          Write-Host "Branch name: $branchName"
          Write-Host "Safe name: $safeName"
          "BRANCH_NAME=$branchName" >> $env:GITHUB_ENV
          "SAFE_BRANCH_NAME=$safeName" >> $env:GITHUB_ENV

      - name: Set version
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Write-Host "Version: $version"

          # Update Cargo.toml
          $cargoPath = "src-tauri\Cargo.toml"
          (Get-Content $cargoPath) -replace '^version = ".*"', "version = `"$version`"" | Set-Content $cargoPath
          Write-Host "Updated Cargo.toml version to: $version"

          # Update tauri.config.json (Tauri v2)
          $tauriPath = "src-tauri\tauri.config.json"
          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 10 | Set-Content $tauriPath
          Write-Host "Updated tauri.config.json version to: $version"

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.bun"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Stamp version into package.json
        run: |
          node -e "const p=require('./package.json'); p.version='${{ needs.version.outputs.version }}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Run tests
        run: bun run test:ci

      - name: Build web
        run: bun run build:web

      - name: Build Tauri app
        run: bun run tauri build --target x86_64-pc-windows-msvc
        env:
          CI: true

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows-x86_64 | Out-Null
          Get-ChildItem -Path src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis -Filter *.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist\windows-x86_64\ }

          Write-Host "Artifacts:"
          Get-ChildItem dist\windows-x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-${{ env.SAFE_BRANCH_NAME }}
          path: dist/windows-x86_64/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ClaudeUI ${{ needs.version.outputs.tag }} (Pre-release)
          prerelease: true
          body: |
            ## Pre-release

            ⚠️ This is a pre-release build for testing. Not recommended for general use.

            ## Changes since last release

            ${{ needs.version.outputs.changelog }}
          files: artifacts/*
          generate_release_notes: false
